name: Harga pasaran ikan Perak (PriceCatcher)

on:
  schedule:
    - cron: "17 1 * * *"   # setiap hari 9:17 pagi waktu Malaysia
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kemas-kini:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pyarrow requests
      - run: python scripts/harga_ikan.py
      - name: Simpan jika berubah
        run: |
          git config user.name "harga-ikan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/harga_ikan_perak.json
          git diff --cached --quiet || git commit -m "Kemas kini harga pasaran ikan Perak"
          git push
